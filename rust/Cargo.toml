[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
default-run = "shopping-sessions"

[dependencies]
ahash = "=0.8.12"
hashbrown = { version = "=0.16.0", default-features = false, features = ["inline-more"] }
memchr = "=2.7.6"
memmap2 = "=0.9.9"
parquet = { version = "=56.2.0", default-features = false, features = ["snap"] }
rayon = "=1.11.0"
serde_json = "=1.0.145"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[features]
redesign = []

[[bin]]
name = "shopping-redesign"
path = "src/redesign/main.rs"
required-features = ["redesign"]
